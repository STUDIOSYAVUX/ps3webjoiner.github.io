<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://w3.org">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>PS3 Evrensel Web Proxy</title>
</head>
<body bgcolor="#111111" text="#FFFFFF" link="#00FF00" vlink="#00FF00" alink="#FF0000" style="margin:0; padding:10px; font-family:sans-serif; text-align:center;">

    <!-- Arama Çubuğu Tablosu -->
    <table width="100%" bgcolor="#222222" cellpadding="10" cellspacing="0" border="0" style="border-bottom: 2px solid #00FF00;">
        <tr>
            <td align="center">
                <font size="4" color="#00FF00"><b>PS3 %100 GitHub Proxy v2.8 (HTML 4.01 Core Edition)</b></font>
                <br><br>
                <input type="text" id="urlInput" value="https://google.com" size="50" style="font-size:16px; background-color:#333333; color:#FFFFFF; border:1px solid #00FF00;">
                <input type="button" value="GİT" onclick="requestSite();">
            </td>
        </tr>
    </table>

    <!-- Durum Mesajı Tablosu -->
    <table width="100%" cellpadding="10" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <font size="3" color="#FFAA00">
                    <div id="status">Gitmek istediginiz adresi yazip GIT butonuna basin.</div>
                </font>
            </td>
        </tr>
    </table>

    <!-- Görüntü ve Harita Alanı -->
    <table cellpadding="0" cellspacing="0" border="0" align="center">
        <tr>
            <td align="center">
                <!-- 404 Hatasını engellemek için mutlak kök dizin yolu '/' kullanıldı. HTML 4 uyumlu width/height atandı. -->
                <img id="pageImage" src="/page_screenshot.png" usemap="#webmap" border="1" width="1" height="1" alt="Sayfa Resmi" onerror="reloadImage();">
                <map name="webmap" id="webmap"></map>
            </td>
        </tr>
    </table>

    <!-- PS3 JavaScript Motoru (JS 1.5) ile Uyumlu Betik -->
    <script type="text/javascript">
        var isLoadedFirst = false;

        function startTimer() {
            checkUpdates();
            setTimeout(startTimer, 5000); 
        }

        function requestSite() {
            document.getElementById('status').innerHTML = "GitHub sunucusu tetikleniyor... Lutfen bekleyin.";
            alert("Istek alindi! Arka planda sunucu sayfayi hazirliyor.");
        }

        // Kırık görseli kesin olarak engelleyen ve resmi zorla bulduran fonksiyon
        function reloadImage() {
            var img = document.getElementById('pageImage');
            document.getElementById('status').innerHTML = "Gorsel yuklenemedi, ana dizinden tekrar cagrilıyor...";
            
            setTimeout(function() {
                var nocache = new Date().getTime();
                // Tarayıcının alt klasör uydurmasını engellemek için doğrudan kök URL'i zorluyoruz
                img.src = "/page_screenshot.png?t=" + nocache;
            }, 3000);
        }

        function checkUpdates() {
            var nocache = new Date().getTime();
            var xhr = false;
            if (window.XMLHttpRequest) { 
                xhr = new XMLHttpRequest(); 
            } else if (window.ActiveXObject) { 
                xhr = new ActiveXObject("Microsoft.XMLHTTP"); 
            }

            if (xhr) {
                xhr.open("GET", "/config.json?t=" + nocache, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && xhr.status == 200) {
                        var data = eval("(" + xhr.responseText + ")");
                        
                        if (data.status == "ready") {
                            document.getElementById('status').innerHTML = "Site Yuklendi: " + data.current_url;
                            
                            var img = document.getElementById('pageImage');
                            
                            // İlk yüklemede görsel boyutlarını PS3 ekranına göre düzeltiyoruz (display:none yerine HTML 4 standardı)
                            if (!isLoadedFirst) {
                                img.src = "/page_screenshot.png?t=" + nocache;
                                img.width = 1024;
                                img.height = 768;
                                isLoadedFirst = true;
                            }

                            var map = document.getElementById('webmap');
                            map.innerHTML = ""; 
                            
                            for (var i = 0; i < data.links.length; i++) {
                                var link = data.links[i];
                                var area = document.createElement('area');
                                area.setAttribute('shape', 'rect');
                                area.setAttribute('coords', link.left + ',' + link.top + ',' + link.right + ',' + link.bottom);
                                area.setAttribute('href', "javascript:requestSite('" + link.href + "');");
                                map.appendChild(area);
                            }
                        }
                    }
                };
                xhr.send(null);
            }
        }

        startTimer();
    </script>
</body>
</html>
